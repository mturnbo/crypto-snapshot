[project]
name = "crypto-snapshot"
version = "1.0.1"
description = "Crypto Portfolio Snapshot Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coinbase-advanced-py>=1.8.2",
    "cryptography>=43.0.0",
    "numpy<2",
    "pandas>=2.2.2",
    "PyJWT>=2.8.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.0",
    "python-kraken-sdk>=3.2.7",
    "requests>=2.32.3",
    "requests-cache>=1.2.1",
    "rich>=13.7.1",
    "web3>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
